appId: ${APP_ID}
name: Dismiss only the stock emulator launcher ANR
---
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible:
            id: "registration-manual|connection-status|android:id/alertTitle"
          timeout: 60000
      - runFlow:
          when:
            visible:
              id: android:id/alertTitle
              text: "^Quickstep isn't responding$"
          commands:
            - tapOn:
                id: android:id/aerr_close
            - assertNotVisible:
                id: android:id/alertTitle
                text: "^Quickstep isn't responding$"
