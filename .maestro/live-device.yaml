appId: ${MAESTRO_APP_ID}
name: Dedicated-device real DPS assignment, local proof and cold restore
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- runFlow:
    file: dismiss-quickstep-anr.yaml
    env:
      APP_ID: ${MAESTRO_APP_ID}
- extendedWaitUntil:
    visible:
      id: registration-manual
    timeout: 60000
- tapOn:
    id: registration-manual
- assertVisible:
    id: connection-registrationId
- tapOn:
    id: registration-back
- assertVisible:
    id: registration-manual
- tapOn:
    id: registration-manual
- tapOn:
    id: connection-registrationId
- eraseText
- inputText: ${MAESTRO_REGISTRATION_ID}
- assertVisible:
    id: connection-registrationId
    text: ${MAESTRO_REGISTRATION_ID_PATTERN}
- tapOn:
    id: connection-scopeId
- eraseText
- inputText: ${MAESTRO_SCOPE_ID}
- pressKey: Enter
- assertVisible:
    id: connection-scopeId
    text: "^${MAESTRO_SCOPE_ID}$"
- scrollUntilVisible:
    element:
      id: connection-provisioningHost
    direction: DOWN
    timeout: 15000
- tapOn:
    id: connection-provisioningHost
- eraseText
- inputText: ${MAESTRO_PROVISIONING_HOST}
- pressKey: Enter
- assertVisible:
    id: connection-provisioningHost
    text: ${MAESTRO_PROVISIONING_HOST_PATTERN}
- scrollUntilVisible:
    element:
      id: connection-deviceKey
    direction: UP
    timeout: 15000
- tapOn:
    id: connection-deviceKey
# The pinned iOS typer can drop rapid events. Each call uses its slow first-character path.
- runFlow:
    when:
      platform: iOS
    commands:
      - evalScript: ${output.keyIndex = 0}
      - repeat:
          times: ${MAESTRO_DEVICE_KEY.length}
          commands:
            - inputText: ${MAESTRO_DEVICE_KEY.charAt(output.keyIndex)}
            - evalScript: ${output.keyIndex = output.keyIndex + 1}
- runFlow:
    when:
      platform: Android
    commands:
      - inputText: ${MAESTRO_DEVICE_KEY}
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: connection-submit
    direction: DOWN
    timeout: 15000
- tapOn:
    id: connection-submit
- extendedWaitUntil:
    visible:
      id: connection-status
      text: "^Connected$"
    timeout: 180000
- assertVisible:
    id: assigned-device-id
    text: ${MAESTRO_EXPECTED_DEVICE_ID_PATTERN}
- assertVisible:
    id: assigned-hub
    text: ${MAESTRO_EXPECTED_HUB_PATTERN}
- tapOn:
    id: connection-details
# Wait for modal presentation before scrolling past its first field.
- extendedWaitUntil:
    visible:
      id: model-id
    timeout: 15000
- assertVisible:
    id: model-id
    text: ${MAESTRO_MODEL_ID_PATTERN}
- scrollUntilVisible:
    element:
      id: registration-id
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: registration-id
    text: ${MAESTRO_REGISTRATION_ID_PATTERN}
- scrollUntilVisible:
    element:
      id: registry-status
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: registry-status
    text: "^Not checked$"
- scrollUntilVisible:
    element:
      id: proof-nonce
    direction: DOWN
    timeout: 15000
- tapOn:
    id: proof-nonce
- eraseText
- inputText: ${MAESTRO_NONCE}
- pressKey: Enter
- assertVisible:
    id: proof-nonce
    text: ${MAESTRO_NONCE_PATTERN}
- scrollUntilVisible:
    element:
      id: proof-send
    direction: DOWN
    timeout: 15000
- tapOn:
    id: proof-send
- scrollUntilVisible:
    element:
      id: proof-status
    direction: DOWN
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: proof-status
      text: "^Submitted locally$"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: registry-status
    direction: UP
    timeout: 15000
- assertVisible:
    id: registry-status
    text: "^Not checked$"
- stopApp
- launchApp:
    clearState: false
    permissions:
      all: deny
- runFlow:
    file: dismiss-quickstep-anr.yaml
    env:
      APP_ID: ${MAESTRO_APP_ID}
- extendedWaitUntil:
    visible:
      id: connection-status
      text: "^Connected$"
    timeout: 180000
- assertNotVisible:
    id: registration-manual
- assertVisible:
    id: assigned-device-id
    text: ${MAESTRO_EXPECTED_DEVICE_ID_PATTERN}
- assertVisible:
    id: assigned-hub
    text: ${MAESTRO_EXPECTED_HUB_PATTERN}
- tapOn:
    id: connection-details
- extendedWaitUntil:
    visible:
      id: model-id
    timeout: 15000
- assertVisible:
    id: model-id
    text: ${MAESTRO_MODEL_ID_PATTERN}
- scrollUntilVisible:
    element:
      id: registration-id
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: registration-id
    text: ${MAESTRO_REGISTRATION_ID_PATTERN}
- scrollUntilVisible:
    element:
      id: registry-status
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: registry-status
    text: "^Not checked$"
- stopApp
