appId: ${APP_ID}
name: Credential-free bundled startup and manual-navigation smoke
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- runFlow: dismiss-quickstep-anr.yaml
- extendedWaitUntil:
    visible:
      id: registration-manual
    timeout: 60000
- assertVisible: "IoT Plug and Play"
- assertVisible: "Connect manually"
- tapOn:
    id: registration-manual
- assertVisible: "Manually connect"
- assertVisible: "Connection info"
- assertVisible: "Registration ID"
- assertVisible: "ID scope"
- tapOn:
    id: connection-registrationId
- inputText: "ci-input-fixture"
- pressKey: Enter
- assertVisible:
    id: connection-registrationId
    text: "^ci-input-fixture$"
- tapOn:
    id: connection-scopeId
- inputText: "0ne00000000"
- pressKey: Enter
- assertVisible:
    id: connection-scopeId
    text: "^0ne00000000$"
- scrollUntilVisible:
    element:
      id: connection-deviceKey
    direction: DOWN
- tapOn:
    id: connection-deviceKey
- inputText: "synthetic+not/a-device-key="
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: connection-provisioningHost
    direction: DOWN
- tapOn:
    id: connection-provisioningHost
- eraseText
- inputText: "global-canary.azure-devices-provisioning.net"
- pressKey: Enter
- assertVisible:
    id: connection-provisioningHost
    text: '^global-canary\.azure-devices-provisioning\.net$'
- scrollUntilVisible:
    element:
      id: connection-submit
    direction: DOWN
- assertVisible:
    id: connection-submit
# Never submit these deliberately invalid fixtures or send cloud traffic.
- tapOn:
    id: registration-back
- assertVisible: ".*Start here.*"
- assertVisible: "Connect manually"
- stopApp
- launchApp:
    clearState: false
    permissions:
      all: deny
- runFlow: dismiss-quickstep-anr.yaml
- extendedWaitUntil:
    visible:
      id: registration-manual
    timeout: 60000
- assertVisible: "IoT Plug and Play"
- assertVisible: "Connect manually"
