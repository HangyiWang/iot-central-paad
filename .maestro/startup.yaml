appId: ${APP_ID}
name: Credential-free bundled startup and manual-navigation smoke
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- runFlow: dismiss-quickstep-anr.yaml
- extendedWaitUntil:
    visible:
      id: registration-manual
    timeout: 60000
- assertVisible:
    id: app-header-title
    text: "^Phone as a device$"
- assertVisible: "Connect manually"
- tapOn:
    id: registration-manual
- assertVisible: "Manually connect"
- assertVisible: "Connection info"
- assertVisible: "Device ID"
- assertVisible: "ID scope"
- tapOn:
    id: registration-back
- assertVisible: ".*Start here.*"
- assertVisible: "Connect manually"
- stopApp
- launchApp:
    clearState: false
    permissions:
      all: deny
- runFlow: dismiss-quickstep-anr.yaml
- extendedWaitUntil:
    visible:
      id: registration-manual
    timeout: 60000
- assertVisible:
    id: app-header-title
    text: "^Phone as a device$"
- assertVisible: "Connect manually"
